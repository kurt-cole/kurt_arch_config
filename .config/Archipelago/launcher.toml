# Archipelago quick launcher  --  SUPER + ;
#
# Two sections:
#   [[entries]]  the games you actually play, one block each, in launcher order
#   [disabled]   everything else installed, one line each -- flip visible = true
#                and it shows up immediately; move it up to [[entries]] when you
#                want to fill in the details
#
# Per entry:
#   visible    show it in the launcher
#   emoji      whatever you like, shown on the left
#   name       label in the list
#   component  Archipelago launcher component, run as: Archipelago "<component>"
#              (leave "" if the game needs no AP client)
#   commands   extra shell commands launched alongside it, in order
#   proton_client  { appid, client, apworld }: run the *Windows* AP client inside
#              the game's running Proton container instead of the Linux one.
#              Needed when the client reads or patches game memory (pymem /
#              ReadProcessMemory), which cannot reach a wine process from the
#              Linux side. Set component = "" for these -- the client comes up in
#              the prefix instead. {} means "no Proton client", the normal case.
#              Nothing to configure in Steam: no launch options, and launching the
#              game from Steam by hand is unaffected. Needs Windows Archipelago in
#              ~/Applications/Archipelago-win (see scripts/ap-proton-client.sh)
#              and commands = ["steam steam://rungameid/<appid>"]. The optional
#              apworld = "<file>.apworld" copies just that world over from the
#              Linux install; without it every custom world is mirrored, which
#              works but makes the client log a warning per world it can't parse.
#
# Blocks, not { } on several lines: TOML forbids a newline inside an inline
# table, so a multi-line entry has to be an [[entries]] block.
#
# In the launcher: j/k or arrows move, / filters, Enter launches, d launches
# with the Archipelago client in a terminal (the Linux equivalent of Windows'
# ArchipelagoLauncherDebug), e opens this file in the editor, q/Esc closes.
#
# Components marked "guessed name" were scraped out of a frozen world and may
# be off -- check against the names in the real Archipelago Launcher.

# ---------------------------------------------------------------- enabled ---

