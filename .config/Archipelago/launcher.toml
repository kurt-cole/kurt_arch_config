[settings]
# Extracted AppImage (~/Applications/Archipelago is a symlink to the current
# Archipelago-X.Y.Z AppDir); AppRun is the same entry point the .AppImage ran.
# The newest ~/Applications/Archipelago*.AppImage is used if this path is gone.
archipelago = "/home/barretglass/Applications/Archipelago/AppRun"
terminal = ["foot", "-a", "ap-debug", "-T", "Archipelago (debug)"]
editor = ["foot", "-a", "ap-config", "-T", "launcher.toml",
          "/home/barretglass/.config/caelestia/scripts/ap-edit.sh"]
