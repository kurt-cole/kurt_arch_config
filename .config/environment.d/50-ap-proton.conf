# Publish each Proton game's container on the session bus as
# com.steampowered.App<appid>, so ap-launcher.py can start an Archipelago
# Windows client inside a running game's prefix.
# Mirrors the export in ~/.config/uwsm/env-hyprland: that one covers anything
# launched from Hyprland (SUPER + S, terminals), this one covers apps started
# by the systemd user manager.
STEAM_COMPAT_LAUNCHER_SERVICE=proton
