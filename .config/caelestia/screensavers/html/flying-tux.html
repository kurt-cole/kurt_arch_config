<!doctype html>
<meta charset="utf-8">
<title>Flying Tux</title>
<canvas id="c"></canvas>
<script src="saver.js"></script>
<script>
// "Flying Windows" -- Windows 3.1 through XP -- with the obvious substitution.
//
// Same projection as the starfield, but each point is a penguin drawn at a size
// proportional to 1/z, so the flock appears to rush past the camera.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, cx = 0, cy = 0, focal = 0;

const COUNT = 55;
const DEPTH = 2200;
const SPEED = 0.42;

const TUX = new Image();
TUX.src = 'tux.png';
const ASPECT = 1057 / 1280;   // the artwork's, so it never stretches

const flock = [];
function spawn(t, atFarPlane) {
    t.x = rand(-1, 1) * DEPTH * 0.8;
    t.y = rand(-1, 1) * DEPTH * 0.8;
    t.z = atFarPlane ? rand(DEPTH * 0.9, DEPTH) : rand(1, DEPTH);
}
for (let i = 0; i < COUNT; i++) { const t = {}; spawn(t, false); flock.push(t); }

fitCanvas(canvas, (w, h) => { W = w; H = h; cx = w / 2; cy = h / 2; focal = Math.max(w, h) * 0.6; });

let last = performance.now();
function frame(now) {
    const dt = Math.min(64, now - last);
    last = now;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (!TUX.complete) { requestAnimationFrame(frame); return; }

    // Far to near, so nearer penguins overlap the ones behind them.
    flock.sort((a, b) => b.z - a.z);
    for (const t of flock) {
        t.z -= SPEED * dt;
        if (t.z < 1) { spawn(t, true); continue; }

        const k = focal / t.z;
        const px = cx + t.x * k, py = cy + t.y * k;
        const h = k * 380, w = h * ASPECT;
        if (px + w < 0 || px - w > W || py + h < 0 || py - h > H) {
            if (t.z < DEPTH * 0.5) spawn(t, true);
            continue;
        }
        ctx.globalAlpha = Math.min(1, (1 - t.z / DEPTH) * 4);
        ctx.drawImage(TUX, px - w / 2, py - h / 2, w, h);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
