<!doctype html>
<meta charset="utf-8">
<title>Mystify</title>
<canvas id="c"></canvas>
<script src="saver.js"></script>
<script>
// "Mystify Your Mind" -- Windows 3.1 through 7.
//
// Two polygons whose vertices bounce around the screen; each frame the current
// outline is pushed onto a short history and the whole history is redrawn, so
// the shape drags a ribbon of its own past behind it. The original cycles the
// hue of each trail copy, which is what gives it the oil-slick look.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

const TRAIL = 14;          // outlines kept behind the leading edge
const TRAIL_MS = 45;       // gap between them, so the ribbon has visible steps
const SPEED = 0.00026;     // fraction of the screen diagonal per ms

function makeShape(vertices) {
    const pts = [];
    for (let i = 0; i < vertices; i++) {
        const a = rand(0, Math.PI * 2);
        pts.push({
            x: rand(0.15, 0.85), y: rand(0.15, 0.85),   // normalised, so resizing is free
            vx: Math.cos(a), vy: Math.sin(a)
        });
    }
    return { pts, history: [], hue: rand(0, 360), hueRate: rand(4, 11) * (Math.random() < 0.5 ? -1 : 1) };
}

const shapes = [makeShape(randInt(4, 5)), makeShape(randInt(4, 5))];
// Start the two shapes on opposite sides of the wheel so they never read as
// one colour, however far the hues drift.
const baseHue = rand(0, 360);
shapes.forEach((s, i) => { s.hue = (baseHue + i * 180) % 360; });

fitCanvas(canvas, (w, h) => { W = w; H = h; });

function step(shape, dt) {
    const aspect = W / H;
    for (const p of shape.pts) {
        // Move in screen space so the motion isn't stretched on wide monitors,
        // then normalise back.
        p.x += p.vx * SPEED * dt / aspect;
        p.y += p.vy * SPEED * dt;
        if (p.x < 0) { p.x = -p.x; p.vx = -p.vx; }
        if (p.x > 1) { p.x = 2 - p.x; p.vx = -p.vx; }
        if (p.y < 0) { p.y = -p.y; p.vy = -p.vy; }
        if (p.y > 1) { p.y = 2 - p.y; p.vy = -p.vy; }
    }
    shape.hue = (shape.hue + shape.hueRate * dt / 1000 + 360) % 360;

    shape.sinceSample += dt;
    if (shape.sinceSample >= TRAIL_MS || shape.history.length === 0) {
        shape.sinceSample = 0;
        shape.history.push({ pts: shape.pts.map(p => [p.x, p.y]), hue: shape.hue });
        if (shape.history.length > TRAIL) shape.history.shift();
    }
}

function draw(shape) {
    const n = shape.history.length;
    shape.history.forEach((snapshot, i) => {
        const age = i / Math.max(1, n - 1);            // 0 = oldest, 1 = current
        ctx.strokeStyle = `hsl(${snapshot.hue} 100% ${18 + age * 47}%)`;
        ctx.lineWidth = Math.max(1, H / 720) * (0.8 + age * 1.4);
        ctx.beginPath();
        snapshot.pts.forEach(([x, y], j) => {
            const px = x * W, py = y * H;
            if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.stroke();
    });
}

let last = performance.now();
function frame(now) {
    const dt = Math.min(64, now - last);
    last = now;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    for (const s of shapes) { step(s, dt); draw(s); }
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
