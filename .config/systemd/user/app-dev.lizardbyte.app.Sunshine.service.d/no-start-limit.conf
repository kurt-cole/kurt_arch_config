# azahar-deck.sh restarts Sunshine twice per session (to point output_name at a
# new headless output, and to revert it on teardown). The packaged unit allows
# only 5 starts per 500s, so a few sessions in a row leave the service dead with
# "start-limit-hit" and nothing streams. Sunshine is cheap to start; drop the
# rate limit rather than the restarts.
[Unit]
StartLimitIntervalSec=0
